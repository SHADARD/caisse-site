[build]
  publish = "."
[build.processing]
  skip_processing = true
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://esm.sh; style-src 'self'; connect-src 'self' https://esm.sh https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[redirects]]
  from = "/api/create-user"
  to = "/.netlify/functions/create-user"
  status = 200
  force = true

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200
  force = true

[[headers]]
  for = "/downloads/flamingo-network-v1.0.0.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=flamingo-network-v1.0.0.apk"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/image1.png"
  [headers.values]
    Content-Type = "image/jpeg"

[[headers]]
  for = "/downloads/flamingo-network-v1.0.1.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=flamingo-network-v1.0.1.apk"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/flamingo-network-v1.0.2.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=flamingo-network-v1.0.2.apk"
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/reset-all"
  to = "/.netlify/functions/reset-all"
  status = 200
  force = true

[[redirects]]
  from = "/api/archive-monthly"
  to = "/.netlify/functions/archive-monthly"
  status = 200
  force = true

[[redirects]]
  from = "/api/delete-managed"
  to = "/.netlify/functions/delete-managed"
  status = 200
  force = true
